general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.05
    animation = fadeIn, 1, 6, smooth
    animation = fadeOut, 1, 5, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 3, smooth
}

# ── The page: no blur, the scribble IS the art ─────────
background {
    monitor =
    path = /usr/share/hypr/lockdead2.png
    color = rgba(11, 11, 11, 1.0)
    brightness = 1.0
    contrast = 1.0
}

# ── Clock, handwritten, top-left ───────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 170
    font_family = Caveat Bold
    color = rgba(235, 235, 235, 0.95)
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
    position = 90, -40
    halign = left
    valign = top
}

# little hand-drawn-ish underline
shape {
    monitor =
    size = 90, 3
    color = rgba(235, 235, 235, 0.55)
    rounding = -1
    position = 100, -255
    halign = left
    valign = top
}

# Date, lowercase like a margin note
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B" | tr '[:upper:]' '[:lower:]'
    font_size = 26
    font_family = Caveat
    color = rgba(170, 170, 170, 1.0)
    position = 100, -280
    halign = left
    valign = top
}

# Day progress bar
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lockinfo.sh day
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(120, 120, 120, 1.0)
    position = 100, -325
    halign = left
    valign = top
}

# ── Top-right status ───────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lockinfo.sh bat
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(150, 150, 150, 1.0)
    position = -40, -30
    halign = right
    valign = top
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(150, 150, 150, 1.0)
    position = -40, -58
    halign = right
    valign = top
}

# ── Greeting above the input ───────────────────────────
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lockinfo.sh greet
    font_size = 30
    font_family = Caveat
    color = rgba(220, 220, 220, 0.95)
    position = 0, 190
    halign = center
    valign = bottom
}

# ── Password pill ──────────────────────────────────────
input-field {
    monitor =
    size = 380, 60
    outline_thickness = 2
    rounding = -1
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(235, 235, 235, 0.45)
    inner_color = rgba(255, 255, 255, 0.04)
    font_color = rgb(235, 235, 235)
    check_color = rgba(166, 227, 161, 0.9)
    fail_color = rgba(243, 139, 168, 0.9)
    capslock_color = rgba(250, 179, 135, 0.9)
    fade_on_empty = false
    font_family = Caveat
    placeholder_text = <i>say the magic word…</i>
    fail_text = <i>nope :(  ($ATTEMPTS)</i>
    position = 0, 105
    halign = center
    valign = bottom
}

# ── Now playing, quiet, bottom-center ──────────────────
label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format "󰎆  {{artist}} - {{title}}" 2>/dev/null
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = rgba(120, 120, 120, 1.0)
    position = 0, 40
    halign = center
    valign = bottom
}

# ── Tilted note, matches the slant of the scribble ─────
label {
    monitor =
    text = locked. you shall not pass :)
    font_size = 28
    font_family = Caveat
    color = rgba(150, 150, 150, 0.7)
    rotate = 15
    position = -90, 110
    halign = right
    valign = bottom
}
